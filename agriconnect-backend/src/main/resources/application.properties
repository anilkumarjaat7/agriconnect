# Server configuration
server.port=8080
server.servlet.context-path=

# Local developer overrides are ignored by Git. The backend .env file (see .env.example)
# is loaded automatically when present; real environment variables still take precedence.
spring.config.import=optional:file:./application-local.properties,optional:file:./.env[.properties]

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agriconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=agriconnect_user
spring.datasource.password=9928
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (for Phase 2 security implementation)
agriconnect.jwt.secret=lksdjfhdsdsdjklfhldslkfhsdkljhfsdflkjdsjhflkdhslkf
agriconnect.jwt.expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Razorpay Payment Gateway.
# Credentials come from the environment only - never commit real keys here.
# Test-mode keys start with rzp_test_ and are the expected default for local work.
# When either value is blank the checkout is disabled and the UI falls back to the
# original no-payment order flow, so the rest of the app keeps working.
agriconnect.razorpay.key-id=${RAZORPAY_KEY_ID:}
agriconnect.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
agriconnect.razorpay.currency=INR

# Automatic state-wise mandi prices (AGMARKNET dataset published on data.gov.in).
# The API key is free from "My Account" on data.gov.in and must be supplied via the environment.
# When it is blank, the importer is skipped and the price list is simply empty - no dummy data.
agriconnect.mandi.api-key=${MANDI_API_KEY:}
agriconnect.mandi.resource-id=${MANDI_RESOURCE_ID:9ef84268-d588-465a-a308-a864a43d0070}
agriconnect.mandi.base-url=https://api.data.gov.in/resource
agriconnect.mandi.page-size=1000
agriconnect.mandi.max-pages=20
agriconnect.mandi.connect-timeout-ms=5000
agriconnect.mandi.read-timeout-ms=20000
# Daily at 06:00 IST; the feed itself is published once per day.
agriconnect.mandi.sync-cron=0 0 6 * * *
agriconnect.mandi.initial-sync=${MANDI_INITIAL_SYNC:false}
agriconnect.mandi.stale-days=7
